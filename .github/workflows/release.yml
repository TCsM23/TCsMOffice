# Every push to main builds TCsOffice for Windows, Linux and Android and
# publishes it as a GitHub Release. Installed copies of the app check the
# latest release on start-up and offer to update.
#
# Version = VERSION file + this workflow's run number, e.g. 1.0.17.
# Bump VERSION (1.0 -> 1.1) for a bigger release.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  windows:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Stamp version
        shell: bash
        run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.version.outputs.version }}"/' office/version.py
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/windows/make_version_info.py
      - run: pyinstaller packaging/tcsoffice.spec --noconfirm
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer wizard
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" packaging\windows\TCsOffice.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/TCsOffice-Setup-*.exe

  linux:
    needs: [version, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libfuse2
      - run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.version.outputs.version }}"/' office/version.py
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller packaging/tcsoffice.spec --noconfirm
      - run: bash packaging/linux/build_appimage.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libltdl-dev libffi-dev libssl-dev zip unzip pkg-config cmake ninja-build libegl1 libgl1 libxkbcommon0
      - run: sed -i 's/^__version__ = .*/__version__ = "${{ needs.version.outputs.version }}"/' office/version.py
      - name: Fetch Qt's Android wheels
        id: qt
        run: |
          python packaging/android/fetch_qt_wheels.py build/wheels | tee wheels.log
          echo "pyside=$(tail -n1 wheels.log)" >> "$GITHUB_OUTPUT"
      - name: Host PySide6 of the same version
        run: pip install "PySide6==${{ steps.qt.outputs.pyside }}" -r packaging/android/requirements-host.txt
      - uses: actions/cache@v4
        with:
          path: ~/.pyside6_android_deploy
          key: android-sdk-ndk-${{ steps.qt.outputs.pyside }}
      - name: Android NDK and SDK
        run: |
          git clone --depth 1 --branch "v${{ steps.qt.outputs.pyside }}" https://code.qt.io/pyside/pyside-setup.git build/pyside-setup \
            || git clone --depth 1 --branch "v${{ steps.qt.outputs.pyside }}" https://github.com/qtproject/pyside-pyside-setup.git build/pyside-setup
          pip install -r build/pyside-setup/tools/cross_compile_android/requirements.txt
          python build/pyside-setup/tools/cross_compile_android/main.py --plat-name=aarch64 --download-only --skip-update --auto-accept-license
      - uses: actions/cache@v4
        with:
          path: build/android/TCsOffice/.buildozer
          key: buildozer-${{ steps.qt.outputs.pyside }}-${{ hashFiles('packaging/android/build_apk.py') }}
      - name: Build the APK
        env:
          # python-for-android's lxml recipe is still 4.8.0, whose C code does not
          # compile against the Python 3.14 it builds for Android. Its recipes
          # honour VERSION_<name>, so use an lxml whose sdist supports 3.14.
          VERSION_lxml: "6.0.2"
        run: |
          # Qt names the files pyside6-...whl in lower case, so match either case.
          shopt -s nocaseglob
          python packaging/android/build_apk.py --version ${{ needs.version.outputs.version }} \
            --wheel-pyside build/wheels/pyside6-*android_aarch64.whl --wheel-shiboken build/wheels/shiboken6-*android_aarch64.whl
      - name: Sign with the TCsOffice key (keeps updates installable over each other)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: the APK keeps its debug signature, so each new APK must replace the old one by uninstalling first."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > build/tcsoffice.keystore
          BT=$(ls -d ~/.pyside6_android_deploy/android-sdk/build-tools/* "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n1)
          APK=$(ls dist/TCsOffice-*.apk)
          "$BT/zipalign" -f -p 4 "$APK" build/aligned.apk
          "$BT/apksigner" sign --ks build/tcsoffice.keystore --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias tcsoffice --out "$APK" build/aligned.apk
          "$BT/apksigner" verify "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    # Publishes whatever built; a platform that failed is simply missing from this release.
    needs: [version, windows, linux, android]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.windows.result == 'success' || needs.linux.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "## TCsOffice $VERSION"
            echo
            git log -1 --pretty=format:'%s%n%n%b' ${{ github.sha }}
            echo
            echo
            echo "**Windows:** run TCsOffice-Setup-$VERSION.exe. **Android:** install TCsOffice-$VERSION.apk. **Linux:** make the AppImage executable and run it."
            echo "Already installed? The app will offer this update by itself."
          } > notes.md
          gh release create "v$VERSION" out/* --title "TCsOffice $VERSION" --notes-file notes.md --target ${{ github.sha }}
